spring.application.name=padel-boking

# Koneksi ke database XAMPP (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/padel_booking
spring.datasource.username=root
spring.datasource.password=

# Hibernate hanya MENGECEK tabel, tidak membuat/mengubahnya
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Biar /actuator/health menampilkan status database
management.endpoint.health.show-details=always

# Kunci penandatangan token. Nilai bawaan ini HANYA untuk lokal; di produksi isi lewat variabel lingkungan JWT_SECRET
app.jwt.secret=${JWT_SECRET:ganti-rahasia-ini-di-produksi-minimal-32-karakter}
app.jwt.expiry-minutes=120